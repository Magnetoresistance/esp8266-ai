; ESP8266 WiFi clock firmware - Claude / Codex status display
; Board: ESP-12S based "SD2/小电视" weather clock w/ 1.54" ST7789 240x240 SPI TFT.
; Pin mapping below comes from the vendor's own working reference firmware
; (TFT_eSPI/User_Setup.h + SmallDesktopDisplay.ino, from the oshwhub SD2 project):
;   CS -> GPIO15/D8   DC -> GPIO0/D3   RST -> GPIO2/D4
;   SCLK -> GPIO14/D5 (HW SPI)   MOSI -> GPIO13/D7 (HW SPI)
;   Backlight -> GPIO5/D1, active LOW, PWM-driven for brightness in vendor fw
; If your board is wired differently, change the TFT_* build_flags below.

; ---- Common settings shared by all environments ----
[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_port = COM7
monitor_port = COM7
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1
    bitbank2/AnimatedGIF@^2.2.0

build_flags =
    ; ---- TFT_eSPI setup for a 128x128 GC9107 SPI panel (0.85", same pins) ----
    ; GC9107 uses the ST7789 command set, so the ST7789_2 driver drives it.
    ; - TFT_INVERSION_ON: this GC9107 panel shows correct colors with INVON
    ;   (user confirmed: needs the inversion toggled back on).
    ; - CGRAM_OFFSET: GC9107 is a 128x160 GRAM chip; the 128x128 panel sits
    ;   at a row offset inside it. colstart/rowstart are applied in firmware
    ;   (applyDisplayRotation) because the stock ST7789_2 rotation table has
    ;   no 128x128 entry.
    -D USER_SETUP_LOADED=1
    -D ST7789_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D CGRAM_OFFSET=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=128
    -D TFT_MOSI=13   ; D7 - HW SPI MOSI
    -D TFT_SCLK=14   ; D5 - HW SPI SCLK
    -D TFT_CS=15     ; D8 - CS
    -D TFT_DC=0      ; D3 - DC
    -D TFT_RST=2     ; D4 - RESET
    -D TFT_BL=5      ; D1 - backlight (polarity selected by TFT_BACKLIGHT_ON)
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    ; ---- WiFiManager: Chinese captive-portal strings (include/wm_strings_zh.h) ----
    -I include
    -D WM_STRINGS_FILE='"wm_strings_zh.h"'

; ---- 4MB flash (default, matches the SD2 vendor board) ----
[env:nodemcuv2]

; ---- 1MB flash variant (smaller FS partition; GIF upload may be limited) ----
[env:nodemcuv2-1mb]
board_build.flash_size = 1MB
board_build.flash_mode = dout
